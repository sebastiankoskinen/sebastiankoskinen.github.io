<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --text:#F2EDE4;
  --dim:rgba(242,237,228,.38);
  --bg:#000;
  --card:#0f0f0f;
  --red:#CC1A1A;
  --purple:#6A0DAD;
  --blue:#1F3A93;
  --pad:32px;
}

html,body{
  width:100%;min-height:100%;
  background:var(--bg);color:var(--text);
  font-family:'Syne',sans-serif;
  -webkit-font-smoothing:antialiased;
  cursor:none;user-select:none;
}

body::before{
  content:'';position:fixed;inset:0;z-index:900;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27%3E%3Cfilter id=%27n%27%3E%3CfeTurbulence type=%27fractalNoise%27 baseFrequency=%270.9%27 numOctaves=%274%27 stitchTiles=%27stitch%27/%3E%3C/filter%3E%3Crect width=%27100%25%27 height=%27100%25%27 filter=%27url(%23n)%27/%3E%3C/svg%3E");
  background-size:160px;animation:grain .35s steps(2) infinite;
}
@keyframes grain{
  0%{background-position:0 0}25%{background-position:-40px 15px}
  50%{background-position:20px -30px}75%{background-position:-15px 40px}
}

#cursor{position:fixed;top:0;left:0;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);will-change:left,top}
.wm{animation:wingFlap 2.4s ease-in-out infinite}
.wm.r{animation-delay:.15s}
@keyframes wingFlap{0%,100%{transform:translateY(0px)}50%{transform:translateY(-3px)}}
*{cursor:none!important}

.header{
  position:sticky;top:0;z-index:800;
  display:flex;align-items:center;justify-content:space-between;
  padding:26px var(--pad);
  border-bottom:1px solid rgba(242,237,228,.07);
  background:rgba(0,0,0,.88);backdrop-filter:blur(14px);
}
.back-link{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);text-decoration:none;transition:color .2s}
.back-link:hover{color:var(--text)}
.page-title{font-family:'Pirata One',cursive;font-size:clamp(22px,2.5vw,34px);letter-spacing:.05em;font-weight:normal}
.page-hint{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}

.nav-wrap{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:24px var(--pad) 20px;
  position:sticky;top:79px;z-index:700;
  background:rgba(0,0,0,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(242,237,228,.04);
}
.pill{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:8px 18px;border-radius:24px;border:1px solid rgba(242,237,228,.18);background:none;color:var(--dim);transition:all .2s}
.pill:hover{color:var(--text);border-color:rgba(242,237,228,.45)}
.pill.active{background:var(--text);color:#000;border-color:var(--text)}
.pill[data-cat="journalism"].active{background:var(--red);border-color:var(--red);color:#fff}
.pill[data-cat="casestudy"].active{background:var(--purple);border-color:var(--purple);color:#fff}
.pill[data-cat="content"].active{background:var(--blue);border-color:var(--blue);color:#fff}
.pill[data-cat="thought"].active{background:var(--red);border-color:var(--red);color:#fff}
.pill[data-cat="columns"].active{background:var(--purple);border-color:var(--purple);color:#fff}
.pill[data-cat="reviews"].active{background:var(--blue);border-color:var(--blue);color:#fff}

main{padding:36px var(--pad) 100px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}

.card{background:var(--card);border-radius:2px;overflow:hidden;text-decoration:none;color:var(--text);display:flex;flex-direction:column;transition:opacity .2s}

.card-img{position:relative;aspect-ratio:16/9;overflow:hidden;flex-shrink:0}
.card-img-inner{position:absolute;inset:-4%;background-size:cover;background-position:center;transition:transform .4s ease;will-change:transform}
.card-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.card-placeholder-init{font-family:'Pirata One',cursive;font-size:clamp(48px,6vw,72px);color:rgba(242,237,228,.1);letter-spacing:.05em;line-height:1;text-shadow:0 0 60px currentColor}

.card-body{padding:16px 18px 20px;display:flex;flex-direction:column;flex:1}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.card-cat{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.14em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid}
.card-cat.c-journalism{color:var(--red);border-color:rgba(204,26,26,.35);background:rgba(204,26,26,.07)}
.card-cat.c-casestudy{color:#9b59e8;border-color:rgba(106,13,173,.35);background:rgba(106,13,173,.07)}
.card-cat.c-content{color:#5a8fe8;border-color:rgba(31,58,147,.35);background:rgba(31,58,147,.07)}
.card-cat.c-thought{color:var(--red);border-color:rgba(204,26,26,.35);background:rgba(204,26,26,.07)}
.card-cat.c-columns{color:#9b59e8;border-color:rgba(106,13,173,.35);background:rgba(106,13,173,.07)}
.card-cat.c-reviews{color:#5a8fe8;border-color:rgba(31,58,147,.35);background:rgba(31,58,147,.07)}
.card-lang{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--dim);font-style:italic}
.card-pub{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:9px}
.card-title{font-family:'Pirata One',cursive;font-size:clamp(17px,1.5vw,21px);line-height:1.25;letter-spacing:.03em;font-weight:normal;margin-bottom:10px;color:var(--text);min-height:2.5em}
.card-excerpt{font-family:'Syne',sans-serif;font-size:12px;line-height:1.8;color:rgba(242,237,228,.5);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:18px;flex:1}
.card-read{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:6px;transition:color .2s,gap .2s;margin-top:auto}
.card:hover .card-read{color:var(--text);gap:10px}

#scanLine{position:fixed;top:0;left:0;width:100%;height:2px;background:var(--red);box-shadow:0 0 14px rgba(204,26,26,1),0 0 32px rgba(204,26,26,.6),0 0 64px rgba(204,26,26,.3);z-index:9500;pointer-events:none;opacity:0;transform:translateY(-2px)}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
</style>

const CAT_LABELS = {journalism:'Journalism',casestudy:'Case study',content:'Content',thought:'Thought leadership',columns:'Column',reviews:'Review'};
const CAT_BG = {
  journalism:'radial-gradient(ellipse at 30% 70%,#1e0202 0%,#060202 100%)',
  casestudy:'radial-gradient(ellipse at 30% 70%,#10031e 0%,#04010a 100%)',
  content:'radial-gradient(ellipse at 30% 70%,#020515 0%,#010208 100%)',
  thought:'radial-gradient(ellipse at 30% 70%,#1a0209 0%,#060102 100%)',
  columns:'radial-gradient(ellipse at 30% 70%,#10031e 0%,#04010a 100%)',
  reviews:'radial-gradient(ellipse at 30% 70%,#020515 0%,#010208 100%)',
};
const CHARS = '!<>-_\\/[]{}=+*^?#ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  
function buildCards(filter){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  const list=filter==='all'?ARTICLES:ARTICLES.filter(a=>a.cat===filter);
  list.forEach((a,i)=>{
    const card=document.createElement('a');
    card.href=a.url; card.target='_blank'; card.rel='noopener noreferrer';
    card.className='card';
    card.style.animation=`cardIn .45s ease ${i*0.04}s both`;
    const imgStyle=a.img?`background-image:url('${a.img}');background-size:cover;background-position:center;`:`background:${CAT_BG[a.cat]};`;
    const initials=a.pub.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    card.innerHTML=`
      <div class="card-img">
        <div class="card-img-inner" style="${imgStyle}"></div>
        ${!a.img?`<div class="card-placeholder"><span class="card-placeholder-init">${initials}</span></div>`:''}
      </div>
      <div class="card-body">
        <div class="card-top">
          <span class="card-cat c-${a.cat}">${CAT_LABELS[a.cat]}</span>
          ${a.lang==='fi'?'<span class="card-lang">FI</span>':''}
        </div>
        <div class="card-pub">${a.pub}&nbsp;&middot;&nbsp;${a.year}</div>
        <div class="card-title">${a.title}</div>
        <div class="card-excerpt">${a.excerpt}</div>
        <div class="card-read">Read&nbsp;&rarr;</div>
      </div>`;
    const imgInner=card.querySelector('.card-img-inner');
    card.addEventListener('mousemove',e=>{
      const r=card.getBoundingClientRect();
      const x=(e.clientX-r.left-r.width/2)/(r.width/2);
      const y=(e.clientY-r.top-r.height/2)/(r.height/2);
      imgInner.style.transform=`translate(${x*-8}px,${y*-6}px)`;
    });
    card.addEventListener('mouseleave',()=>{imgInner.style.transform='translate(0,0)';});
    const titleEl=card.querySelector('.card-title');
    grid.appendChild(card);
  });
}

const scanLine=document.getElementById('scanLine');
let currentCat='all',scanning=false;
function scanAndFilter(newCat){
  if(scanning||newCat===currentCat)return;
  scanning=true;
  document.querySelectorAll('.pill').forEach(p=>p.classList.toggle('active',p.dataset.cat===newCat));
  gsap.set(scanLine,{y:-2,opacity:1});
  let swapped=false;
  gsap.to(scanLine,{y:window.innerHeight+2,duration:0.52,ease:'power2.inOut',
    onUpdate(){if(!swapped&&gsap.getProperty(scanLine,'y')>window.innerHeight*0.42){swapped=true;currentCat=newCat;buildCards(newCat);}},
    onComplete(){gsap.set(scanLine,{opacity:0,y:-2});scanning=false;}
  });
}
document.getElementById('navWrap').addEventListener('click',e=>{
  const pill=e.target.closest('.pill');
  if(pill)scanAndFilter(pill.dataset.cat);
});

const cursorEl=document.getElementById('cursor');
let mx=innerWidth/2,my=innerHeight/2,cx=mx,cy=my;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
(function loop(){requestAnimationFrame(loop);cx+=(mx-cx)*.10;cy+=(my-cy)*.10;cursorEl.style.left=cx+'px';cursorEl.style.top=cy+'px';})();

buildCards('all');
</script>
